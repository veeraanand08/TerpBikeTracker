<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Submitted — TerpBikeTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display { font-family: 'Space Grotesk', sans-serif; }

        @keyframes impactShake {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            12%  { transform: translate(-14px, 10px) rotate(-1.2deg) scale(1.02); }
            24%  { transform: translate(14px, -9px) rotate(1.1deg) scale(1.02); }
            36%  { transform: translate(-10px, -7px) rotate(-0.8deg) scale(1.01); }
            48%  { transform: translate(9px, 8px) rotate(0.7deg) scale(1.01); }
            60%  { transform: translate(-6px, 4px) rotate(-0.4deg) scale(1); }
            75%  { transform: translate(4px, -3px) rotate(0.2deg) scale(1); }
            88%  { transform: translate(-2px, 2px) rotate(-0.1deg) scale(1); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }
        .animate-shake { animation: impactShake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        @keyframes shockwaveExpand {
            0%   { transform: translate(-50%, -50%) scale(0.15); opacity: 0.95; border-width: 14px; }
            100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; border-width: 1px; }
        }
        .shockwave-ring {
            position: absolute; top: 50%; left: 50%; width: 240px; height: 240px;
            border-radius: 9999px; border-style: solid; border-color: rgba(255,255,255,0.85);
            pointer-events: none; opacity: 0;
        }
        .shockwave-active { animation: shockwaveExpand 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .shockwave-secondary { animation: shockwaveExpand 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.06s forwards; border-color: rgba(254,202,202,0.6); }

        @keyframes impactFlash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
        .flash-active { animation: impactFlash 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes wheelSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .wheel-spinning { transform-origin: center; transform-box: fill-box; animation: wheelSpin 1.4s linear infinite; }
        .wheel-paused { animation-play-state: paused; }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.4s ease forwards; }
    </style>
</head>
<body class="bg-slate-950 text-white antialiased">

    <main id="stage" class="relative w-screen h-screen overflow-hidden flex items-center justify-center bg-slate-950 transition-colors duration-300">

        <div class="absolute inset-0 pointer-events-none opacity-15"
             style="background-image: radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1px); background-size: 32px 32px;"></div>

        <div id="vignette" class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_20%,rgba(0,0,0,0.65)_100%)] transition-opacity duration-500"></div>

        <header class="absolute top-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-3 px-4 py-1.5 rounded-full bg-black/35 backdrop-blur-md border border-white/15 shadow-lg">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
            <span id="statusText" class="text-xs font-semibold tracking-widest uppercase text-white/90">Sending your report...</span>
        </header>

        <div id="flashOverlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-30"></div>
        <div id="shockwave1" class="shockwave-ring z-20"></div>
        <div id="shockwave2" class="shockwave-ring z-20"></div>
        <canvas id="particleCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-20"></canvas>

        <div id="rectLeft"
             class="absolute top-1/2 left-0 -translate-y-1/2 w-[50vw] h-36 sm:h-44 md:h-52 bg-neutral-950 border-y border-r border-white/20 shadow-[20px_0_60px_rgba(0,0,0,0.85)] z-10 flex items-center justify-end pr-4 sm:pr-6 will-change-transform"
             style="transform: translate3d(-100%, -50%, 0);">
            <div class="flex items-center gap-1.5 opacity-40">
                <div class="w-1.5 h-16 sm:h-24 bg-white/40 rounded-full"></div>
                <div class="w-2.5 h-20 sm:h-28 bg-red-500 rounded-full"></div>
            </div>
        </div>

        <div id="rectRight"
             class="absolute top-1/2 right-0 -translate-y-1/2 w-[50vw] h-36 sm:h-44 md:h-52 bg-neutral-950 border-y border-l border-white/20 shadow-[-20px_0_60px_rgba(0,0,0,0.85)] z-10 flex items-center justify-start pl-4 sm:pl-6 will-change-transform"
             style="transform: translate3d(100%, -50%, 0);">
            <div class="flex items-center gap-1.5 opacity-40">
                <div class="w-2.5 h-20 sm:h-28 bg-red-500 rounded-full"></div>
                <div class="w-1.5 h-16 sm:h-24 bg-white/40 rounded-full"></div>
            </div>
        </div>

        <div id="bikeWrapper" class="relative z-20 flex flex-col items-center justify-center will-change-transform transition-transform duration-150">
            <div id="bikeShadow" class="absolute -bottom-3 w-48 sm:w-64 h-4 bg-black/50 rounded-full blur-md transition-all duration-300"></div>

            <svg id="bicycleSvg" class="w-56 sm:w-72 md:w-80 h-auto drop-shadow-[0_10px_25px_rgba(0,0,0,0.65)]" viewBox="0 0 320 190" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="rearWheel" class="wheel-spinning">
                    <circle cx="72" cy="126" r="46" stroke="#F8FAFC" stroke-width="6"/>
                    <circle cx="72" cy="126" r="39" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
                    <line x1="72" y1="80" x2="72" y2="172" stroke="#CBD5E1" stroke-width="1.5"/>
                    <line x1="26" y1="126" x2="118" y2="126" stroke="#CBD5E1" stroke-width="1.5"/>
                    <line x1="39.5" y1="93.5" x2="104.5" y2="158.5" stroke="#CBD5E1" stroke-width="1.5"/>
                    <line x1="104.5" y1="93.5" x2="39.5" y2="158.5" stroke="#CBD5E1" stroke-width="1.5"/>
                    <circle cx="72" cy="126" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
                </g>
                <g id="frontWheel" class="wheel-spinning">
                    <circle cx="248" cy="126" r="46" stroke="#F8FAFC" stroke-width="6"/>
                    <circle cx="248" cy="126" r="39" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
                    <line x1="248" y1="80" x2="248" y2="172" stroke="#CBD5E1" stroke-width="1.5"/>
                    <line x1="202" y1="126" x2="294" y2="126" stroke="#CBD5E1" stroke-width="1.5"/>
                    <line x1="215.5" y1="93.5" x2="280.5" y2="158.5" stroke="#CBD5E1" stroke-width="1.5"/>
                    <line x1="280.5" y1="93.5" x2="215.5" y2="158.5" stroke="#CBD5E1" stroke-width="1.5"/>
                    <circle cx="248" cy="126" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
                </g>
                <path d="M72 126 L142 126 L116 64 L72 126 Z" stroke="#FFFFFF" stroke-width="6.5" stroke-linejoin="round"/>
                <path d="M142 126 L216 64 L116 64" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M210 46 L248 126" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
                <line x1="116" y1="64" x2="107" y2="42" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
                <path d="M90 41 L124 41 C127 41 128 45 123 46 L94 46 C89 46 88 41 90 41 Z" fill="#EF4444"/>
                <path d="M210 46 L228 46 C238 46 242 56 234 64 L224 68" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="142" cy="126" r="13" fill="#1E293B" stroke="#EF4444" stroke-width="3.5"/>
                <line x1="142" y1="126" x2="153" y2="145" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
                <line x1="146" y1="145" x2="160" y2="145" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
            </svg>

            <div id="impactBadge" class="mt-3 px-4 py-1 rounded-full bg-white text-red-700 font-display font-bold text-xs sm:text-sm tracking-widest uppercase opacity-0 translate-y-2 transition-all duration-300 shadow-xl">
                REPORT SUBMITTED
            </div>
        </div>

        <!-- Continue button, appears after impact -->
        <button id="continueBtn"
                class="absolute bottom-10 left-1/2 -translate-x-1/2 z-40 px-6 py-2.5 rounded-xl bg-white text-slate-950 font-semibold text-sm shadow-xl opacity-0 pointer-events-none transition-opacity duration-300">
            Continue →
        </button>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stage = document.getElementById('stage');
            const rectLeft = document.getElementById('rectLeft');
            const rectRight = document.getElementById('rectRight');
            const bikeWrapper = document.getElementById('bikeWrapper');
            const rearWheel = document.getElementById('rearWheel');
            const frontWheel = document.getElementById('frontWheel');
            const flashOverlay = document.getElementById('flashOverlay');
            const shockwave1 = document.getElementById('shockwave1');
            const shockwave2 = document.getElementById('shockwave2');
            const impactBadge = document.getElementById('impactBadge');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const continueBtn = document.getElementById('continueBtn');

            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class SparkParticle {
                constructor(x, y) {
                    this.x = x; this.y = y;
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * 14 + 4;
                    this.vx = Math.cos(angle) * velocity;
                    this.vy = Math.sin(angle) * velocity;
                    this.size = Math.random() * 5 + 2;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.025 + 0.015;
                    const colors = ['#FFFFFF', '#FECACA', '#FCA5A5', '#FEF08A', '#171717'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.25;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.vx *= 0.94; this.vy *= 0.94; this.vy += 0.18;
                    this.alpha -= this.decay;
                    this.rotation += this.rotSpeed;
                }
                draw(context) {
                    if (this.alpha <= 0) return;
                    context.save();
                    context.globalAlpha = Math.max(0, this.alpha);
                    context.translate(this.x, this.y);
                    context.rotate(this.rotation);
                    context.fillStyle = this.color;
                    context.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
                    context.restore();
                }
            }

            function spawnImpactParticles(count = 65) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                for (let i = 0; i < count; i++) particles.push(new SparkParticle(centerX, centerY));
            }

            function renderParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw(ctx);
                    if (particles[i].alpha <= 0) particles.splice(i, 1);
                }
                requestAnimationFrame(renderParticles);
            }
            renderParticles();

            function easeInExpo(t) { return t === 0 ? 0 : Math.pow(2, 10 * t - 10); }

            function triggerCollisionCrash() {
                stage.classList.remove('bg-slate-950');
                stage.classList.add('bg-red-600');

                void stage.offsetWidth;
                stage.classList.add('animate-shake');

                void flashOverlay.offsetWidth;
                flashOverlay.classList.add('flash-active');
                shockwave1.classList.add('shockwave-active');
                shockwave2.classList.add('shockwave-secondary');

                bikeWrapper.style.transform = 'scale(0.92)';
                setTimeout(() => {
                    bikeWrapper.style.transform = 'scale(1.04)';
                    setTimeout(() => { bikeWrapper.style.transform = 'scale(1)'; }, 120);
                }, 90);

                rearWheel.classList.add('wheel-paused');
                frontWheel.classList.add('wheel-paused');
                rectLeft.classList.add('border-white/50');
                rectRight.classList.add('border-white/50');

                spawnImpactParticles(65);

                impactBadge.classList.remove('opacity-0', 'translate-y-2');
                statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
                statusText.textContent = 'Report received';

                // Reveal Continue button shortly after impact
                setTimeout(() => {
                    continueBtn.classList.remove('opacity-0', 'pointer-events-none');
                }, 600);

                // Fallback: auto-continue after a few seconds if user doesn't click
                setTimeout(() => {
                    notifyParentDone();
                }, 4200);
            }

            function playCrashAnimation() {
                const approachDuration = 680;
                const leadInDelay = 250;
                let startTime = null;

                function step(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const elapsed = timestamp - startTime;

                    if (elapsed < leadInDelay) {
                        requestAnimationFrame(step);
                        return;
                    }

                    const activeTime = elapsed - leadInDelay;
                    const progress = Math.min(activeTime / approachDuration, 1);
                    const eased = easeInExpo(progress);

                    const leftOffset = -100 + (eased * 100);
                    const rightOffset = 100 - (eased * 100);

                    rectLeft.style.transform = `translate3d(${leftOffset}%, -50%, 0)`;
                    rectRight.style.transform = `translate3d(${rightOffset}%, -50%, 0)`;

                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        triggerCollisionCrash();
                    }
                }
                requestAnimationFrame(step);
            }

            let notified = false;
            function notifyParentDone() {
                if (notified) return;
                notified = true;
                window.parent.postMessage('terpbike-report-animation-done', '*');
            }

            continueBtn.addEventListener('click', notifyParentDone);

            setTimeout(playCrashAnimation, 350);
        });
    </script>
</body>
</html>
