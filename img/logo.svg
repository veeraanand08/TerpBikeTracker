<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <!-- TerpBikeTrack mark: a simplified Maryland state flag in a circle (not the official UMD logo) -->
  <defs>
    <clipPath id="circle"><circle cx="50" cy="50" r="50"/></clipPath>
    <!-- Calvert quarter: gold and black stripes, colors swapped along the diagonal band -->
    <clipPath id="bend"><polygon points="0,0 14,0 50,36 50,50 36,50 0,14"/></clipPath>
    <g id="calvert">
      <rect width="50" height="50" fill="#ffd200"/>
      <g fill="#000"><rect x="8.33" width="8.33" height="50"/><rect x="25" width="8.33" height="50"/><rect x="41.67" width="8.33" height="50"/></g>
      <g clip-path="url(#bend)">
        <rect width="50" height="50" fill="#000"/>
        <g fill="#ffd200"><rect x="8.33" width="8.33" height="50"/><rect x="25" width="8.33" height="50"/><rect x="41.67" width="8.33" height="50"/></g>
      </g>
    </g>
    <!-- Crossland quarter: red and white with a cross in the opposite colors -->
    <clipPath id="redQuarters"><rect x="25" width="25" height="25"/><rect y="25" width="25" height="25"/></clipPath>
    <g id="cross">
      <rect x="21" y="7" width="8" height="36"/><rect x="7" y="21" width="36" height="8"/>
      <circle cx="25" cy="7" r="4.5"/><circle cx="25" cy="43" r="4.5"/><circle cx="7" cy="25" r="4.5"/><circle cx="43" cy="25" r="4.5"/>
    </g>
    <g id="crossland">
      <rect width="50" height="50" fill="#fff"/>
      <rect x="25" width="25" height="25" fill="#e21833"/><rect y="25" width="25" height="25" fill="#e21833"/>
      <use xlink:href="#cross" href="#cross" fill="#e21833"/>
      <g clip-path="url(#redQuarters)"><use xlink:href="#cross" href="#cross" fill="#fff"/></g>
    </g>
  </defs>
  <g clip-path="url(#circle)">
    <use xlink:href="#calvert" href="#calvert"/>
    <use xlink:href="#crossland" href="#crossland" x="50"/>
    <use xlink:href="#crossland" href="#crossland" y="50"/>
    <use xlink:href="#calvert" href="#calvert" x="50" y="50"/>
  </g>
  <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
</svg>
